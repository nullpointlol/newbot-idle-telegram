services:
  - type: web
    name: idle-pet-tycoon
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm test
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADSGRAM_SECRET
        sync: false
